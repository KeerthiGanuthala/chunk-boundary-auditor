name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Prove the wheel runs outside the checkout
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/pip install dist/*.whl
          cd /tmp && /tmp/w/bin/chunkaudit audit

      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # PyPI trusted publishing: register this repository and workflow on the project's PyPI
      # page first. Until then the step is a no-op failure that does not affect the release.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
