name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests
        run: >
          python -m pytest -q
          --junitxml=reports/junit.xml
          --cov=chunkaudit
          --cov-report=json:reports/coverage.json
          --cov-report=term

      - name: Coverage floor
        run: |
          python - <<'PY'
          import json, sys
          pct = json.load(open("reports/coverage.json"))["totals"]["percent_covered"]
          floor = 95.0
          print(f"line coverage {pct:.1f}% (floor {floor}%)")
          sys.exit(0 if pct >= floor else 1)
          PY

      - name: Fixture matches policy
        run: python -m chunkaudit generate --check

      - name: Audit (the headline table)
        run: python -m chunkaudit audit

      - name: Experiments
        run: make experiments

      - name: Receipts
        run: make receipts

      - name: Experiment results as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiments-py${{ matrix.python-version }}
          path: |
            docs/experiments/*.json
            docs/metrics.json
            reports/junit.xml
            reports/coverage.json

      - name: Awkward numbers to the job summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          m = json.load(open("docs/metrics.json"))["metrics"]
          lines = [
              "## chunk-boundary-auditor: the numbers that are not flattering",
              "",
              "| figure | value |",
              "| --- | --- |",
              f"| facts broken by `sort=True` extraction before any chunker runs | {m['sorted_broken']} of {m['facts_total']} ({m['sorted_broken_pct']}%) |",
              f"| facts the best strategy still orphans at {m['policy_size']} tokens | {m['sentence_window_orphaned']} of {m['facts_total']} |",
              f"| facts fixed windows orphan at {m['policy_size']} tokens | {m['fixed_orphaned']} |",
              f"| extra facts lost by giving the recursive splitter 32 tokens of overlap | {m['recursive_overlap_32_extra_lost']} |",
              f"| cross-page facts page-aware chunking loses, out of {m['facts_cross_page']} | {m['page_aware_cross_page_orphaned']} |",
              "",
              f"{m['tests_total']} tests, {m['coverage_line_pct']}% line coverage, every figure above re-measured in this run.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          PY
