<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="chunk-boundary-auditor: which facts did your chunker make unretrievable">
  <title>chunk-boundary-auditor</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 46px; font-weight: 700; fill: #f0f3f6; letter-spacing: -0.5px; }
    .sub { font-size: 20px; fill: #9fb0c3; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-size: 13px; fill: #7d8fa3; }
    .span { font-size: 15px; fill: #d7dee6; }
    .count { font-size: 30px; font-weight: 700; fill: #ffb454; }
    .chunk { fill: #16202b; stroke: #2e3f52; stroke-width: 1.5; }
    .cut { stroke: #ff6b6b; stroke-width: 3; stroke-dasharray: 120; stroke-dashoffset: 120;
           animation: draw 1.6s ease-out 0.6s forwards; }
    .fact { stroke: #ffb454; stroke-width: 3; fill: none; stroke-dasharray: 520; stroke-dashoffset: 520;
            animation: draw 2.4s ease-out 0.2s forwards; }
    .pulse { animation: pulse 2.6s ease-in-out 2.4s infinite; }
    .fadein { opacity: 0; animation: fade 0.8s ease-out 2.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .cut, .fact { animation: none; stroke-dashoffset: 0; }
      .pulse { animation: none; }
      .fadein { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#121c28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="none" stroke="#1f2d3b" stroke-width="2"/>

  <text class="t title" x="56" y="92">chunk-boundary-auditor</text>
  <text class="t sub" x="58" y="128">Which facts did your chunker make unretrievable? Measured, not assumed.</text>

  <!-- three chunks with a fact that straddles the first boundary -->
  <g transform="translate(58,170)">
    <rect class="chunk" x="0" y="0" width="250" height="78" rx="6"/>
    <rect class="chunk" x="262" y="0" width="250" height="78" rx="6"/>
    <rect class="chunk" x="524" y="0" width="250" height="78" rx="6"/>
    <text class="t mono label" x="12" y="20">chunk 0</text>
    <text class="t mono label" x="274" y="20">chunk 1</text>
    <text class="t mono label" x="536" y="20">chunk 2</text>
    <text class="t span" x="12" y="50">The Varlen K2 unit was</text>
    <text class="t span" x="12" y="68">commissioned in 1987.</text>
    <text class="t span" x="274" y="50">Its rated output is 412 MW.</text>
    <text class="t span" x="536" y="50">Operators replaced the inlet</text>
    <text class="t span" x="536" y="68">filters in spring.</text>
    <!-- the fact: an arc joining the two spans across the boundary -->
    <path class="fact" d="M 120 32 C 160 -22, 330 -22, 372 32"/>
    <!-- the cut -->
    <line class="cut pulse" x1="256" y1="-8" x2="256" y2="86"/>
  </g>

  <!-- the number -->
  <g class="fadein" transform="translate(900,160)">
    <text class="t label" x="0" y="0">facts a single chunk never holds</text>
    <text class="t mono count" x="0" y="42">{sentence_window_orphaned} / {facts_total}</text>
    <text class="t label" x="0" y="66">best strategy, {policy_size} tokens</text>
    <text class="t label" x="0" y="86">fixed windows: {fixed_orphaned}, sorted extraction: {sorted_broken}</text>
  </g>
</svg>
