[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chunk-boundary-auditor"
version = "0.1.0"
description = "Measures which facts a chunking strategy makes unretrievable, on seeded PDFs, offline."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Laxmi Keerthi Reddy Ganuthala"}]
keywords = ["rag", "chunking", "pdf", "retrieval", "evaluation", "pymupdf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pymupdf>=1.24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]
evidence = [
    "playwright>=1.45",
    "cmarkgfm>=2022.10",
]

[project.scripts]
chunkaudit = "chunkaudit.cli:main"

[project.urls]
Homepage = "https://github.com/KeerthiGanuthala/chunk-boundary-auditor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chunkaudit = ["data/policy.toml", "data/fixtures/*.pdf", "data/fixtures/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "experiments", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The explainer embeds a web page as one string; its CSS and JS lines are not Python lines.
"tools/render_explainer.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["chunkaudit"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
